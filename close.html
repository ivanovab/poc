<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: #f4f5f7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; padding: 2rem 1.5rem;
      background: #fff; border-radius: 12px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 { margin: 0 0 1.5rem; font-size: clamp(1.5rem, 5vw, 2rem); }
    button {
      width: 100%; max-width: 200px; padding: 0.75rem 1.5rem;
      font-size: 1rem; border: none; border-radius: 8px;
      background: #2563eb; color: #fff; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>close</h1>
    </div>
</body></html>
